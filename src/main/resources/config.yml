# =============================================
#          TheBrewingMarket Configuration
# =============================================
# Supports MiniMessage format for all text fields.
# The layout uses symbols to define the GUI structure.
#
# Price formula: base_price * brewery:score (0.01 to 1.0)
#
# -- Item Components --------------------------
# Each icon has a 'material', an optional 'components' block mirroring the
# vanilla data-component format (kebab-case), and an optional 'action'.
# Supported components:
#   custom-name                - Item name (MiniMessage)
#   lore                       - List of lines (MiniMessage)
#   profile                    - Head profile (properties: name/value)
#   enchantments               - Enchantment:level map
#   custom-model-data          - floats, flags, strings, colors
#   item-model                 - Model resource location
#   potion-contents            - Potion custom-color
#   tooltip-display            - hide-tooltip / hidden-components
#   tooltip-style              - Custom tooltip style
#   enchantment-glint-override - Force the glint on/off

# Internal version — do not edit. Bump = new keys were added.
config-version: 2

# Language file to use from the lang/ folder (without .yml)
# Available: en_US, es_ES (or create your own)
lang: 'en_US'

# Number of records shown per page in /tbm history (1-32)
history-per-page: 8

market:
  # Allow selling brews from inside shulker boxes via "Sell All".
  # Set to false to disable for everyone. When true, individual
  # players can be excluded by negating the thebrewingmarket.shulker permission.
  shulker-selling: true

  # Number format for money in the GUI and messages (Java DecimalFormat pattern).
  money-format: '#,##0.##'

  title: '<white>🍺 <gradient:#FCBDE3:#F973C4><b>Liquor Store</b></gradient> 🍺</white>'
  layout:
    - 'JJLKTKLJJ'
    - 'IIIIIIIII'
    - 'IIIIIIIII'
    - 'IIIIIIIII'
    - 'IIIIIIIII'
    - 'JJLBCSLJJ'

  # -- Daily earnings limit -------------------
  # Caps how much money each player can earn from the market per day.
  # Sales that would exceed the cap are rejected entirely.
  limitation:
    enable: true
    earnings: 10000

  # -- Prices --------------------------------
  # final_price = base_price * brewery:score
  # Missing recipes use 'default'. Set a price to 0 to forbid selling.
  #
  # Two formats, mixable. Flat entries override groups on collision:
  #   wine: 150              # flat: recipe -> price
  #   groups:                # groups: price -> [recipes]
  #     30:
  #       - darkbeer
  #       - wheatbeer
  brews:
    default: 10
    beer: 25
    cidre: 35
    wine: 150
    mead: 120
    apple_liquor: 140
    tequila: 170
    shroom_vodka: 220
    gr_absinthe: 300
    coffee: 40
    iced_coffee: 50
    hot_choc: 35
    eggnog: 60
    hangover_detox: 80
    groups:
      30:
        - darkbeer
        - wheatbeer
      130:
        - ap_mead
        - vodka
      160:
        - g_vodka
        - gin
        - red_sangria
      180:
        - rum
        - gin_and_tonic
      200:
        - whiskey
        - brandy
        - french_75
      250:
        - fire_whiskey
        - absinthe

  # -- Garden prices (fruits and seeds) -------
  # For servers running the Garden plugin. Fixed price (no quality; score is 1).
  # Same format as 'brews'. Ids are '<plant>_fruit' or '<plant>_seeds'.
  # default: 0 keeps unlisted produce unsellable.
  garden:
    default: 0
    # strawberry_fruit: 5
    # strawberry_seeds: 2
    # groups:
    #   10:
    #     - apple_fruit
    #     - cherry_fruit

  # -- Item Slots -----------------------------
  # Symbol for slots where players can place/view brews
  item-slot:
    symbol: 'I'

  # -- Sell Button (sells only items in the GUI) --
  sell-icons:
    symbol: 'B'
    allow-icon:
      material: 'potion'
      components:
        custom-name: '<gradient:#FCBDE3:#F973C4>● <b>Sell drink</b></gradient>'
        lore:
          - ''
          - ' <font:uniform><white>Sell all brews from</white></font> '
          - ' <font:uniform><white>above for <#FCBDE3><money></#FCBDE3> coins.</white></font> '
          - ''
          - ' <font:uniform><gradient:#FCBDE3:#F973C4><b>> Click to sell</b> 🍺</gradient></font>'
          - ''
        potion-contents:
          custom-color: 16679863
        tooltip-display:
          hidden-components:
            - 'potion-contents'
      action:
        sound:
          type: 'sound'
          value: 'minecraft:block.amethyst_block.place'
    deny-icon:
      material: 'glass_bottle'
      components:
        custom-name: '<gradient:#FF7373:#FF0D0D><b>Nothing to sell!</b></gradient>'
        lore:
          - ''
          - '  <#FF7373>❌</#FF7373> <white><font:uniform>Nothing to sell!</font></white> <#FF0D0D>❌</#FF0D0D>  '
          - ''
      action:
        sound:
          type: 'sound'
          value: 'minecraft:entity.villager.no'

  # -- Sell All Button (sells from GUI + scans inventory) --
  sell-all-icons:
    symbol: 'S'
    allow-icon:
      material: 'potion'
      components:
        custom-name: '<gradient:#FCBDE3:#F973C4>● <b>Sell all!</b></gradient>'
        lore:
          - ''
          - ' <font:uniform><white>Sell all brews from your</white></font> '
          - ' <font:uniform><white>inventory for <#FCBDE3><money></#FCBDE3> coins.</white></font> '
          - ''
          - ' <font:uniform><gradient:#FCBDE3:#F973C4><b>> Click to sell</b> 🍺</gradient></font>'
          - ''
        potion-contents:
          custom-color: 16679863
        enchantment-glint-override: true
        tooltip-display:
          hidden-components:
            - 'potion-contents'
      action:
        sound:
          type: 'sound'
          value: 'minecraft:block.amethyst_block.place'
    deny-icon:
      material: 'glass_bottle'
      components:
        custom-name: '<gradient:#FF7373:#FF0D0D><b>Nothing to sell!</b></gradient>'
        lore:
          - ''
          - '  <#FF7373>❌</#FF7373> <white><font:uniform>Nothing to sell!</font></white> <#FF0D0D>❌</#FF0D0D>  '
          - ''
      action:
        sound:
          type: 'sound'
          value: 'minecraft:entity.villager.no'

  # -- Title Icon -----------------------------
  title-icon:
    symbol: 'T'
    material: 'player_head'
    components:
      custom-name: '<white>🍺 <gradient:#FCBDE3:#F973C4><b>Liquor Store</b></gradient> 🍺</white>'
      lore:
        - ''
        - ' <white>Place your brews below and...</white> '
        - ' <white>Sell them for money!</white> '
        - ''
        - ' <white>The price depends on the recipe</white> '
        - ' <white>and the brew quality.</white> '
        - ''
      profile:
        properties:
          - name: 'textures'
            value: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNTg4NzZjZTFiY2VjMmI5MjI0ZjRkNjhlZTA0ZjdjNjNiZjM1NGJhOTY2ZmE2YTVjYjg4ZDFiNWMwNTA0ZGRjMyJ9fX0='

  # -- Close Button ---------------------------
  close-icon:
    symbol: 'C'
    material: 'player_head'
    components:
      custom-name: '<gradient:#FCBDE3:#F973C4><b>Close</b></gradient>'
      profile:
        properties:
          - name: 'textures'
            value: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNTg4NzZjZTFiY2VjMmI5MjI0ZjRkNjhlZTA0ZjdjNjNiZjM1NGJhOTY2ZmE2YTVjYjg4ZDFiNWMwNTA0ZGRjMyJ9fX0='

  # -- Decorative Icons -----------------------
  decorative-icons:
    pink-glass:
      symbol: 'J'
      material: 'pink_stained_glass_pane'
      components:
        tooltip-display:
          hide-tooltip: true
    brain-coral:
      symbol: 'K'
      material: 'brain_coral'
      components:
        tooltip-display:
          hide-tooltip: true
    brain-coral-fan:
      symbol: 'L'
      material: 'brain_coral_fan'
      components:
        tooltip-display:
          hide-tooltip: true